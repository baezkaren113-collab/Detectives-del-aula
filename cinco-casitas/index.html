/* Paper-cut village and illuminated doors */
#home{position:relative;isolation:isolate}
#home::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 18% 22%,#fff6cb 0 1px,transparent 2px),radial-gradient(circle at 72% 35%,#fff 0 1px,transparent 2px);background-size:73px 61px,113px 89px;mask-image:linear-gradient(#000,transparent 95%)}
header h1{color:#fff2d1;text-shadow:0 5px #0b182d,0 0 42px #ffbc5c44}
header p:last-child{color:#ffedcd}
.village{position:relative;min-height:310px;margin-top:10px;padding:45px 20px 28px;background:radial-gradient(ellipse at bottom,#bfd3e3 0%,#7b99af 39%,#28465e 68%,transparent 72%);border-bottom-color:#fcf2e5}
.house{position:relative;display:grid;align-content:end;justify-items:stretch;filter:drop-shadow(0 7px 6px #07152d80)}
.house:nth-child(2n){margin-bottom:22px}
.house:nth-child(3){margin-bottom:42px}
.roof{height:clamp(44px,8vw,108px);background:repeating-linear-gradient(0deg,#fff4e6 0 7px,#e4cdb7 8px,#fff4e6 10px);filter:drop-shadow(0 4px 0 #431f29)}
.walls{background:repeating-linear-gradient(0deg,transparent 0 16px,#fff2de22 17px 18px),var(--wall);border:2px solid #ffe7ba80;border-radius:0 0 12px 12px;padding-top:14px}
.windows i{height:31px;background:linear-gradient(90deg,transparent 44%,#80502e 45% 55%,transparent 56%),linear-gradient(transparent 43%,#80502e 44% 55%,transparent 56%),#ffcd76;box-shadow:0 0 7px #ffd07d55;transition:box-shadow .25s,background-color .25s}
.doorway{display:block;margin:10px auto 0;width:43%;height:56px;background:#481f20;border-radius:15px 15px 0 0;perspective:120px}
.door{width:100%;height:100%;margin:0;position:relative;background:repeating-linear-gradient(90deg,transparent 0 8px,#f6cc9a28 9px),var(--door)}
.door::after{content:"";position:absolute;width:6px;height:6px;background:#ffe5a1;border-radius:50%;right:12%;top:53%}
.house.opening .door{transform:rotateY(-76deg)}
.house.opening .doorway{background:#ffe4a0;box-shadow:0 0 22px #ffe4a0}
.house.opening .windows i,.house.visited .windows i{background-color:#fff4bc;box-shadow:0 0 18px #ffc260}
.house.visited .name::before{content:"✦ ";color:#ffd58a}
.name{background:#111e33;border:1px solid #e7c495;color:#fff0d2;border-radius:999px;padding:6px 4px;min-height:34px}
.content{border-color:#c99a5e;background:linear-gradient(145deg,#213b52,#15243b);box-shadow:0 18px 100px #060d1f77}
.card h2{color:#ffddb1}
#home .star{font-size:1.35rem}
@media(max-width:700px){.village{min-height:0;padding:18px 4px}.house:nth-child(n){margin-bottom:0}.name{font-size:.8rem}.doorway{height:40px}.windows i{height:20px}}

.service-title{display:inline-block;margin:.7rem 0 0;padding:.55rem 1.15rem;border:1px solid #f8d184;border-radius:999px;background:#142337;color:#ffe0a1;font-weight:850;letter-spacing:.1em}
.trail{text-align:center;margin:0 auto}
.trail-lights{display:flex;justify-content:center;gap:clamp(12px,5vw,46px);color:#c9d6e8;font-size:1.55rem}
.trail-lights span{transition:color .25s,transform .25s,text-shadow .25s}
.trail-lights .lit{color:#ffdb73;transform:scale(1.25);text-shadow:0 0 16px #ffdd7e}
#progress{margin:.45rem 0;color:#e9ddc5}
#ending{margin:1rem auto;max-width:46rem;background:#322e3c;border:1px solid #e7b568;border-radius:14px;padding:1rem;color:#ffe8b4}
.slide-nav{justify-content:space-between;margin-bottom:1rem}

#home::before,.star{display:none}
#home header h1{font-size:clamp(2rem,5vw,4.3rem)}
#home header h1 br{display:none}
.village{display:block;position:relative;width:min(100%,940px);aspect-ratio:626/468;min-height:0;margin:18px auto;padding:0;border:1px solid #bda580;border-radius:18px;box-shadow:0 12px 55px #0008;background:#152238 var(--village-art) center/100% 100% no-repeat}
.village .house{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px;min-height:44px;margin:0;padding:2px;border-radius:12px;isolation:isolate}
.village .house::before{content:"";display:block;width:13px;height:13px;background:#ffdb88;border:2px solid #fff7d7;border-radius:50%;box-shadow:0 0 14px 5px #ffbd54}
.village .house.visited::before{background:#fff;box-shadow:0 0 18px 8px #ffcc68}
.village .house.opening::before{transform:scale(1.7);transition:transform .25s}
.village .name{min-height:0;margin:0;padding:3px 8px;font-size:clamp(.72rem,1.7vw,1.15rem);white-space:nowrap;background:#111c2df2}
.village .house:hover .name,.village .house:focus-visible .name{background:#52341e}
.village .house:nth-child(1){--x:12%;--y:67%}
.village .house:nth-child(2){--x:29%;--y:64%}
.village .house:nth-child(3){--x:54%;--y:53%}
.village .house:nth-child(4){--x:74%;--y:65%}
.village .house:nth-child(5){--x:88%;--y:79%}

.gallery-section{margin:1.4rem 0;padding:clamp(12px,3vw,24px);border:1px solid #bda580;border-radius:18px;background:linear-gradient(#101d31ee,#152238f2),var(--village-art) center/cover;color:#fff5e0}
.gallery-toggle{margin:12px 0;background:#ffdda1;color:#17243a;font-weight:800;border-color:#ffdda1}.gallery-toggle:hover{background:#ffeac7}
.gallery-section h3{font:700 1.55rem Georgia,serif;color:#ffddb1;margin:0 0 12px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:9px}
.gallery-grid button{padding:0;border:1px solid #bd9b68;border-radius:10px;overflow:hidden;background:#122337;aspect-ratio:1}
.gallery-grid img{display:block;width:100%;height:100%;object-fit:cover}
.gallery-grid button[aria-pressed=true]{outline:2px solid #ffda91;outline-offset:2px}
.gallery-feature{margin:0 0 12px;text-align:center}
.gallery-feature img{display:block;max-width:100%;max-height:420px;margin:auto;border-radius:9px}

<script type="application/json" id="data">[{"name": "Lectura", "idea": "Leé un texto breve y elegí una idea para contar con tus palabras."}, {"name": "Números", "idea": "Compará dos números y explicá cuál va primero."}, {"name": "Geometría", "idea": "Girá una pieza y probá en qué lugar encaja."}, {"name": "Secuencias", "idea": "Ordená tres imágenes y contá qué pasó primero, después y al final."}, {"name": "Cantidades", "idea": "Elegí un número y representalo con fichas."}]</script>
<script>
const byId = id => document.getElementById(id);
const students = JSON.parse(byId('data').textContent);
let lastHouse;
let opening = false;
const visited = new Set();
function updateTrail() {
  const count = visited.size;
  document.querySelectorAll('.trail-lights span').forEach((light, index) => {
    light.classList.toggle('lit', index < count);
  });
  byId('progress').textContent = count + ' de ' + students.length + ' casitas visitadas';
  byId('ending').hidden = count !== students.length;
}
updateTrail();
function show(section) {
  for (const id of ['home', 'slide']) byId(id).hidden = id !== section;
}
function openHouse(student, button) {
  if (opening) return;
  opening = true;
  lastHouse = button;
  const index = students.indexOf(student);
  visited.add(index);
  updateTrail();
  const next = students[(index + 1) % students.length];
  byId('next').textContent = 'Ir a la casita de ' + next.name + ' →';
  button.classList.add('opening', 'visited');
  byId('student').textContent = student.name;
  byId('idea').textContent = student.idea;
  const reveal = () => {
    show('slide');
    button.classList.remove('opening');
    opening = false;
    byId('student').focus();
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) reveal();
  else setTimeout(reveal, 310);
}
function goHome(focus) {
  show('home');
  focus?.focus();
}
for (const [index, student] of students.entries()) {
  const house = document.createElement('button');
  house.className = 'house';
  house.type = 'button';
  house.setAttribute('aria-label', 'Abrir la casita de ' + student.name);
  house.innerHTML = '<span class="name"></span>';
  house.querySelector('.name').textContent = student.name;
  house.addEventListener('click', () => openHouse(student, house));
  byId('village').append(house);
}
byId('back').onclick = () => goHome(lastHouse);
byId('next').onclick = () => {
  const houses = Array.from(byId('village').querySelectorAll('.house:not(.memories-house)'));
  const nextIndex = (houses.indexOf(lastHouse) + 1) % houses.length;
  goHome(houses[nextIndex]);
  openHouse(students[nextIndex], houses[nextIndex]);
};
</script>
</html>
