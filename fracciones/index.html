<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FRACCIONES · ALIMENTOS REALES</title>
<style>
:root{--card:#312e81;--acc:#fde047;--ok:#4ade80;--bad:#f87171;--txt:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Arial,Helvetica,sans-serif;text-transform:uppercase;letter-spacing:.4px;background:linear-gradient(160deg,#1e3a8a,#6d28d9 55%,#be185d);min-height:100vh;color:var(--txt);display:flex;justify-content:center;padding:14px}
.app{width:100%;max-width:660px;padding-bottom:40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.title{font-weight:900;font-size:1.1rem;color:var(--acc)}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);padding:8px 12px;border-radius:999px;font-weight:700;font-size:.9rem;border:2px solid #f0abfc}
.progress{height:12px;background:#4c1d95;border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#fb923c);transition:width .5s}
.card{background:var(--card);border-radius:22px;padding:20px;border:3px solid #f0abfc;animation:pop .3s ease;margin-top:10px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
h2{font-size:1.3rem;margin:0 0 10px;color:var(--acc);line-height:1.3}
.big{font-size:1.15rem;line-height:1.5;margin:10px 0;font-weight:700;text-align:center}
.small{font-size:.95rem;color:#e0e7ff;line-height:1.5;margin:8px 0}
.center{text-align:center}
.profe{display:flex;gap:14px;align-items:center;background:linear-gradient(90deg,#f97316,#db2777);border-radius:20px;padding:12px;border:3px solid #fff}
.avatar{width:96px;height:96px;border-radius:50%;background:#fde047;display:flex;align-items:center;justify-content:center;font-size:3.6rem;border:4px solid #fff;flex-shrink:0;box-shadow:0 0 0 4px #fb7185;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.bubble{background:#fff;color:#0f172a;border-radius:16px;padding:12px 14px;font-weight:900;font-size:.98rem;line-height:1.45}
.snd{background:#fff;border:3px solid #0f172a;border-radius:50%;width:56px;height:56px;font-size:1.6rem;cursor:pointer;flex-shrink:0}
.snd:hover{transform:scale(1.08)}
.btn{background:var(--acc);color:#0f172a;border:0;border-radius:16px;padding:14px 20px;font-weight:900;font-size:1.05rem;cursor:pointer;margin:12px 6px 0 0;min-height:54px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--txt);border:3px solid #c4b5fd}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-weight:900;vertical-align:middle;line-height:1.05;margin:0 4px}
.frac>span:last-child{border-top:4px solid currentColor;padding-top:3px;min-width:1.1em;text-align:center}
.choco{display:flex;gap:4px;padding:10px;margin:16px auto;background:#3b1a0b;border-radius:18px;border:4px solid #7c2d12;box-shadow:0 8px 18px #0008}
.pc{flex:1;height:90px;border:0;border-radius:8px;background:linear-gradient(160deg,#7c3f1d,#4a2109);cursor:pointer;box-shadow:inset 0 3px 0 #a16207aa;transition:transform .15s}
.pc:hover{transform:translateY(-3px)}
.pc.on{background:linear-gradient(160deg,#fde047,#f59e0b);box-shadow:inset 0 3px 0 #fff8}
span.pc{cursor:default}
.pz{width:230px;height:230px;display:block;margin:14px auto}
.sl{fill:#b45309;stroke:#fff;stroke-width:3;cursor:pointer;transition:transform .15s}
.sl:hover{opacity:.85}
.sl.on{fill:#fde047}
.sl.st{cursor:default}
.side .pz{width:90px;height:90px;margin:0 auto}
.gloss{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin-bottom:12px}
.gloss .frac{font-size:2.2rem}
.gl small{color:#e0e7ff;font-weight:700;font-size:.8rem}
.gl.top b{color:var(--acc)}
.gl.bot b{color:#f9a8d4}
.legend{background:#0f172a;border-radius:12px;padding:8px 10px;font-size:.8rem;margin-bottom:6px;color:#e0e7ff;line-height:1.4}
.side .choco{padding:5px;gap:3px;border-radius:10px;margin:4px 0;border-width:3px}
.side .pc{height:40px}
.cell{flex:1;background:#4c1d95;border-left:3px solid #fff;cursor:pointer}
.cell:first-child{border-left:0}
.cell.on{background:#f472b6}
.cell.st{cursor:default}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:12px}
.opt{background:#0e7490;color:#fff;border:3px solid #67e8f9;border-radius:18px;padding:14px 8px;cursor:pointer;font-size:1.2rem;font-weight:900;min-height:66px}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#052e16}
.opt.bad{background:var(--bad);border-color:var(--bad)}
.opt:disabled{cursor:default}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.side{width:100%;background:#4c1d95;border:3px solid #c4b5fd;border-radius:16px;padding:6px;cursor:pointer;color:#fff}
.side.sel{border-color:var(--acc);background:#a16207}
.side.ok{border-color:var(--ok);background:#14532d}
.side .pc{height:40px}
.adj{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0;font-weight:900}
.pm{width:56px;height:56px;border-radius:14px;border:0;background:#f472b6;color:#fff;font-size:1.8rem;font-weight:900;cursor:pointer}
.num{font-size:2rem;min-width:50px;text-align:center;background:#0f172a;border-radius:12px;padding:4px 10px}
.feed{min-height:44px;margin-top:12px;font-weight:700;font-size:1rem;padding:12px;border-radius:14px;line-height:1.5}
.feed.ok{background:#14532d}
.feed.bad{background:#7f1d1d}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
.tile{background:#4c1d95;color:#fff;border:3px solid #f0abfc;border-radius:18px;padding:14px 8px;cursor:pointer;font-weight:900;font-size:.9rem;min-height:140px}
.tile:disabled{opacity:.45;cursor:default;border-color:#64748b}
.tile .ti{font-size:2.4rem;margin-bottom:6px}
.tile .st{color:var(--acc);margin-top:6px;font-size:1rem}
.stars{font-size:2.4rem;letter-spacing:6px;margin:10px 0}
.burst{position:fixed;pointer-events:none;font-size:2rem;animation:fly 1s ease-out forwards;z-index:99}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

/* PERSONAJE DOCENTE */
.profe{align-items:center;gap:12px;padding:12px 14px}.avatar{width:122px;height:180px;min-width:122px;border:0;border-radius:20px;background:radial-gradient(ellipse,#fff4bd 0%,#fde04755 50%,transparent 73%);box-shadow:none;font-size:initial;animation:bob 3s ease-in-out infinite}.avatar img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 4px #32115f55)}.bubble{flex:1}.profe.talking .avatar{animation:teacherTalk .5s ease-in-out infinite alternate}@keyframes teacherTalk{to{transform:translateY(-4px) rotate(2deg)}}button:focus-visible{outline:4px solid white;outline-offset:4px}@media(max-width:480px){.profe{gap:9px;padding:10px;flex-wrap:wrap}.avatar{width:85px;min-width:85px;height:132px}.bubble{font-size:.9rem;padding:10px;flex:1;min-width:160px}.profe .snd{width:auto;height:44px;border-radius:12px;margin-left:auto;font-size:1.2rem;padding:0 14px}.profe .snd:after{content:' ESCUCHAR';font-size:.8rem;font-weight:900}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.realpizza{width:280px;height:280px;filter:drop-shadow(0 9px 7px #0006)}.realpizza g[role=button]{cursor:pointer}.realpizza g:focus{outline:none;filter:brightness(1.3)}.realchoco{display:flex;background:#fff5dd;border:5px solid #eac67d;border-radius:18px;padding:12px;gap:3px;margin:24px auto;box-shadow:0 10px 15px #0005;max-width:440px;height:185px}.realpc{display:block;min-width:0;flex:1;border:2px solid #663415;background-size:calc(var(--slices)*200%) 100%;background-position:var(--pos) center;border-radius:4px;transition:transform .2s;cursor:pointer}.realpc.chosen{transform:translateY(-15px);outline:4px solid #fde047;box-shadow:0 8px 10px #0007}.side .realchoco{height:85px;padding:4px;margin:12px 0;border-width:2px}.side .realpizza{width:120px;height:120px}.counter{background:#0f172a;border:2px solid #fde047;border-radius:16px;text-align:center;padding:14px;margin-top:12px;font-size:1.1rem;font-weight:900}.counter .frac{font-size:2rem}.foodpick{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}.foodpick button,.foodpick select{font:inherit;font-weight:bold;border-radius:12px;padding:10px;background:#fff;color:#312e81;border:3px solid #a78bfa;min-height:48px}.foodpick button.active{background:#fde047}.labtag{color:#fde047;font-weight:900}.realpc:focus-visible{outline:4px solid #fff}.profe .bubble{min-width:0}@media(max-width:480px){.realchoco{height:145px}.realpizza{width:245px;height:245px}.side .realchoco{height:70px}.side .realpizza{width:95px;height:95px}}
.chocolate-equal{display:block;width:100%;height:auto;margin:22px auto 8px;max-width:500px;overflow:visible;filter:drop-shadow(0 7px 4px #0005)}.chocolate-equal g[role=button]{cursor:pointer}.chocolate-equal g[role=button]:focus{outline:none;filter:brightness(1.25)}.equal-caption{text-align:center;font-size:.85rem;font-weight:bold;color:#fde047;line-height:1.5;margin-bottom:15px}.side .chocolate-equal{margin:12px auto 4px}.side .equal-caption{font-size:.65rem}.chocolate-equal text{user-select:none}</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">🍕 FRACCIONES CON ALIMENTOS REALES</div>
    <div class="hud">
      <div class="pill" id="pSt">MAPA</div>
      <div class="pill" id="pSc">PUNTOS: 0</div>
      <div class="pill" id="pSe">SEGUIDOS: 0</div>
    </div>
  </header>
  <div class="progress"><div id="bar"></div></div>
  <div class="center" style="margin-bottom:16px"><button class="btn" style="width:100%;margin:0" onclick="openLab()">🍕 ENTRAR AL LABORATORIO INTERACTIVO 🍫</button></div><main id="app"></main>
</div>
<script src="game.js"></script>
</body>
</html>
