<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lente DIA · Zamba</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>body{margin:0;font-family:system-ui;background:#172d28}#ui{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:16px;background:#fffef4ed;color:#173b33}button{padding:12px 15px;margin:5px;border:0;border-radius:12px;background:#245d48;color:white;font:700 15px system-ui}#status{font-weight:700;margin:6px}small{display:block;font-size:12px}a{color:#245d48}</style></head><body>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;" embedded color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets><a-asset-item id="zambaModel" src="./zamba.glb"></a-asset-item></a-assets><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-entity id="boy" gltf-model="#zambaModel" position="0 -0.52 0.12" scale="0.46 0.46 0.46" rotation="0 0 0"></a-entity><a-light type="ambient" intensity="1.3"></a-light><a-light type="directional" position="1 2 3" intensity="1.4"></a-light></a-entity></a-scene>
<div id="ui"><div id="status" role="status">LENTE DIA · ZAMBA</div><button id="start">ABRIR CÁMARA</button><button id="voice">ACTIVAR VOZ</button><button id="stop">DETENER</button><small>Enfocá la lámina completa con buena luz, sin reflejos. Zamba es un personaje creado con IA. La voz usa ElevenLabs y consume créditos.</small><small><a href="./lamina.jpg" target="_blank">Ver la lámina</a></small></div>
<script type="module">
import {Conversation} from 'https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.26.0/+esm';
const scene=document.querySelector('a-scene'),status=document.querySelector('#status'),target=document.querySelector('#target'),boy=document.querySelector('#boy');let found=false,conversation=null,speaking=false,busy=false;
const ready=new Promise(resolve=>scene.hasLoaded?resolve():scene.addEventListener('loaded',resolve,{once:true}));
let running=false;document.querySelector('#start').onclick=async()=>{if(running)return;try{await ready;status.textContent='Abriendo cámara…';await scene.systems['mindar-image-system'].start();running=true;status.textContent='Enfocá la lámina de Zamba';}catch(e){status.textContent='No se pudo abrir la cámara: '+e.message;}};
target.addEventListener('targetFound',()=>{found=true;status.textContent='¡Lámina reconocida! Podés activar la voz.';});target.addEventListener('targetLost',()=>{found=false;status.textContent='Volvé a enfocar la lámina completa';});
document.querySelector('#voice').onclick=async()=>{if(busy||conversation)return;if(!found){status.textContent='Primero enfocá la lámina con la cámara';return;}busy=true;try{conversation=await Conversation.startSession({agentId:'agent_9801m4vexm3sf4xrhdcap731h1nr',connectionType:'websocket',onModeChange:({mode})=>{speaking=mode==='speaking';status.textContent=speaking?'Zamba está hablando':'Zamba te escucha';},onDisconnect:()=>{conversation=null;speaking=false;},onError:e=>{status.textContent='Error de voz: '+String(e?.message||e);}});}catch(e){status.textContent='No se pudo activar la voz: '+e.message;}finally{busy=false;}};
async function stop(){if(conversation)await conversation.endSession();conversation=null;speaking=false;if(running)scene.systems['mindar-image-system'].stop();running=false;status.textContent='Cámara y voz detenidas';}document.querySelector('#stop').onclick=stop;addEventListener('pagehide',stop);
function animate(t){if(found)boy.setAttribute('rotation',{x:0,y:speaking?Math.sin(t*.003)*5:0,z:speaking?Math.sin(t*.002)*2:0});requestAnimationFrame(animate);}requestAnimationFrame(animate);
</script></body></html>
