<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meli · El Colorado</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<style>
  :root { --bg:#1d2a22; --ink:#f4efe3; --gold:#d9a441; --card:rgba(20,28,23,.82); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:radial-gradient(circle at 50% 30%, #35513f, var(--bg) 70%); color:var(--ink); font-family: system-ui, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #scene { position:fixed; inset:0; }
  #panel { position:fixed; left:0; right:0; bottom:0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); background:var(--card); backdrop-filter: blur(6px); border-top:2px solid var(--gold); }
  h1 { margin:0 0 4px; font-size:1.25rem; color:var(--gold); }
  p.sub { margin:0 0 10px; font-size:.9rem; opacity:.9; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { background:var(--gold); color:#1d2a22; border:0; border-radius:999px; padding:10px 18px; font-weight:700; cursor:pointer; font-size:.95rem; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--ink); }
  button:disabled { opacity:.5; cursor:default; }
  #estado { font-size:.85rem; opacity:.85; }
  #aviso { font-size:.78rem; opacity:.75; margin-top:8px; }
  #error { color:#ffb4a2; font-size:.85rem; margin-top:8px; display:none; }
  @media (min-width: 720px) {
    #panel { left:auto; right:24px; bottom:24px; width:380px; border:2px solid var(--gold); border-radius:14px; }
  }
</style>
</head>
<body>
<div id="scene"></div>

<div id="panel">
  <h1>Meli</h1>
  <p class="sub">Osa melera de ficción. Exploramos Formosa y aprendemos a cuidar la naturaleza.</p>
  <div class="row">
    <button id="btnHablar">Hablar</button>
    <button id="btnCortar" class="ghost" disabled>Cortar</button>
    <span id="estado">Desconectado</span>
  </div>
  <div id="error"></div>
  <p id="aviso">Soy una recreación con IA: no soy una persona real. Las historias marcadas como ficción no son datos históricos. Tu voz se envía a ElevenLabs para la conversación.</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.26.0/+esm";

// ---------- Configuración ----------
// ID del agente: se toma de ?agente=ID en la dirección, o del valor por defecto de abajo.
const AGENT_ID = new URLSearchParams(location.search).get("agente") || "agent_6401m4vcd1k8ehcse1swvbmz4sv6";

// ---------- Escena ----------
const container = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.35, 5.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.25, 0);
controls.enableDamping = true;
controls.minDistance = 3;
controls.maxDistance = 8;
controls.update();

scene.add(new THREE.HemisphereLight(0xfff3d6, 0x2a3b2e, 1.1));
const sun = new THREE.DirectionalLight(0xffe2b0, 1.4);
sun.position.set(-3, 5, 4);
sun.castShadow = true;
scene.add(sun);

// Piso
const piso = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.MeshStandardMaterial({ color: 0x3e5a45, roughness: 1 }));
piso.rotation.x = -Math.PI / 2;
piso.receiveShadow = true;
scene.add(piso);

// ---------- Personaje: Meli, osa melera estilizada ----------
const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:0.85});
const dorado=mat(0xe5c387), negro=mat(0x242020), blanco=mat(0xffffff);
const figura=new THREE.Group(); scene.add(figura);
function esfera(parent,m,x,y,z,sx,sy,sz){const o=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;parent.add(o);return o;}
esfera(figura,dorado,0,1.2,0,.48,.68,.35);
esfera(figura,negro,0,1.35,.25,.34,.48,.15);
for(const x of [-.27,.27]){esfera(figura,dorado,x,.42,0,.20,.43,.20);esfera(figura,negro,x,.12,.15,.19,.09,.26);}
const cabeza=new THREE.Group();cabeza.position.set(0,2.05,0);figura.add(cabeza);
esfera(cabeza,dorado,0,0,0,.34,.38,.31);
for(const x of [-.30,.30]){esfera(cabeza,dorado,x,.29,0,.12,.16,.08);esfera(cabeza,negro,x,.29,.065,.075,.10,.02);esfera(cabeza,blanco,x*.55,.09,.26,.065,.075,.04);esfera(cabeza,negro,x*.55,.09,.30,.032,.045,.015);}
esfera(cabeza,dorado,0,-.07,.42,.17,.15,.43);
esfera(cabeza,negro,0,-.07,.82,.08,.065,.06);
const boca=esfera(cabeza,negro,0,-.16,.72,.055,.02,.09);
const parpados=[];
const brazoDer=new THREE.Group();brazoDer.position.set(.43,1.65,0);figura.add(brazoDer);
esfera(brazoDer,dorado,0,-.25,0,.13,.38,.14);esfera(brazoDer,negro,0,-.58,.08,.12,.13,.12);
const brazoIzq=new THREE.Group();brazoIzq.position.set(-.43,1.65,0);figura.add(brazoIzq);esfera(brazoIzq,dorado,0,-.25,0,.13,.38,.14);esfera(brazoIzq,negro,0,-.58,.08,.12,.13,.12);brazoIzq.rotation.z=-.25;
const curva=new THREE.CatmullRomCurve3([new THREE.Vector3(0,.8,-.2),new THREE.Vector3(-.45,.45,-.45),new THREE.Vector3(-.9,.35,-.2),new THREE.Vector3(-1.15,.7,0),new THREE.Vector3(-1,.95,.05)]);
const cola=new THREE.Mesh(new THREE.TubeGeometry(curva,32,.10,12,false),dorado);figura.add(cola);
// ---------- Estado de la boca y gestos ----------
let volumen = 0;
let tiempoBlink = 2 + Math.random() * 2;
let parpadeando = 0;

function animar(t) {
  requestAnimationFrame(animar);
  const dt = 1 / 60;

  // Boca: abre según el volumen de la voz del agente
  const abierta = Math.min(1, volumen * 4.5);
  boca.scale.y = 0.02 + abierta * 0.08;
  boca.scale.x = 0.055;

  // Respiración y balanceo
  figura.position.y = Math.sin(t * 0.0015) * 0.02;
  cabeza.rotation.z = Math.sin(t * 0.0012) * 0.03 + (hablando ? Math.sin(t * 0.01) * 0.04 : 0);

  // Gesto del brazo derecho al hablar
  brazoDer.rotation.z = -0.9 + (hablando ? Math.sin(t * 0.006) * 0.2 : Math.sin(t * 0.0015) * 0.03);

  // Parpadeo
  tiempoBlink -= dt;
  if (tiempoBlink <= 0) { parpadeando = 0.12; tiempoBlink = 2 + Math.random() * 3; }
  parpadeando = Math.max(0, parpadeando - dt);
  for (const p of parpados) p.scale.y = parpadeando > 0 ? 1 : 0.1;

  controls.update();
  renderer.render(scene, camera);
}

let hablando = false;
animar(0);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Conexión con ElevenLabs ----------
const btnHablar = document.getElementById("btnHablar");
const btnCortar = document.getElementById("btnCortar");
const estado = document.getElementById("estado");
const errorBox = document.getElementById("error");
let conversacion = null;

function mostrarError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = "block";
}

btnHablar.addEventListener("click", async () => {
  errorBox.style.display = "none";
  if (!AGENT_ID || AGENT_ID.startsWith("PEGAR_AQUI")) {
    mostrarError("Falta el ID del agente. Agregalo en la dirección como ?agente=TU_ID o en el código.");
    return;
  }
  btnHablar.disabled = true;
  estado.textContent = "Conectando…";
  try {
    conversacion = await Conversation.startSession({
      agentId: AGENT_ID,
      connectionType: "websocket",
      onConnect: () => { estado.textContent = "Conectado: hablá con Meli"; btnCortar.disabled = false; },
      onDisconnect: () => { estado.textContent = "Desconectado"; btnHablar.disabled = false; btnCortar.disabled = true; hablando = false; conversacion = null; },
      onModeChange: ({ mode }) => { hablando = mode === "speaking"; estado.textContent = mode === "speaking" ? "Meli habla…" : "Escuchando…"; },
      onError: (e) => { mostrarError("Error: " + (e?.message || e)); },
    });
  } catch (e) {
    mostrarError("No se pudo conectar. Revisá que el agente sea público y que la página esté en https. Detalle: " + (e?.message || e));
    btnHablar.disabled = false;
    estado.textContent = "Desconectado";
  }
});

btnCortar.addEventListener("click", async () => {
  if (conversacion) await conversacion.endSession();
});

// Volumen de salida del agente (para mover la boca)
setInterval(() => {
  if (conversacion && typeof conversacion.getOutputVolume === "function") {
    volumen = conversacion.getOutputVolume() || 0;
  } else {
    volumen = 0;
  }
}, 50);
</script>
</body>
</html>
