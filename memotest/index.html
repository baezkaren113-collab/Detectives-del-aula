<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEMOTEST INCLUSIVO</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#182c39;font-family:Arial,sans-serif}main{max-width:850px;margin:auto;padding:24px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}p{font-size:20px;line-height:1.5}button,select{font:700 18px Arial;padding:14px;border:2px solid #224e64;border-radius:12px;background:white;color:#182c39;cursor:pointer}button:focus-visible,select:focus-visible{outline:4px solid #cf7400;outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.primary{background:#224e64;color:white}.stats{display:flex;gap:20px;margin:22px 0;font-size:20px;font-weight:bold}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{min-height:135px;font-size:36px;background:#224e64;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.card span{font-size:clamp(12px,2.6vw,20px)}.card.open{background:white;color:#182c39}.card.matched{background:#dfeddf;color:#173f26;border:3px solid #366244}.card:disabled{cursor:default;opacity:1}#message{min-height:32px;font-size:22px;font-weight:bold}#win{background:#dfeddf;padding:24px;border-radius:16px;margin-top:16px} [hidden]{display:none!important}@media(max-width:500px){main{padding:16px}#board{gap:8px}.card{min-height:105px;padding:8px}.stats{font-size:16px;gap:12px}}@media(prefers-reduced-motion:no-preference){.card{transition:background .15s}}

/* Colores y formas que conservan el contraste y el foco visible. */
body{background:radial-gradient(circle at 8% 8%,#dceafa 0,transparent 35%),radial-gradient(circle at 92% 85%,#fce6ca 0,transparent 40%),#f4f4fc}
main{margin:24px auto;background:rgba(255,255,255,.95);border:2px solid #d6deed;border-radius:26px;box-shadow:0 12px 35px #24365a12}
h1{color:#40367c}h1:before{content:'🧩 ';} .controls{padding:16px;background:#f0effa;border-radius:16px}.primary{background:#493c91;border-color:#493c91}.stats>div{background:#fff3d6;padding:12px 16px;border-radius:12px;border:2px solid #c6a44c}#pairs{background:#e6f4ee;border-color:#599a82}
.card{border-width:3px;border-color:#272453;background:#453b85;box-shadow:0 5px 0 #272453;font-size:44px;border-radius:18px}
.card:nth-child(4n+2){background:#00666b;border-color:#00464a;box-shadow:0 5px 0 #00464a}.card:nth-child(4n+3){background:#9b3d51;border-color:#692d3a;box-shadow:0 5px 0 #692d3a}.card:nth-child(4n){background:#315a99;border-color:#1e3964;box-shadow:0 5px 0 #1e3964}
.card.open{background:#fff9e9;color:#182c39;border-color:#a27620;box-shadow:0 5px 0 #a27620}.card.matched{background:#e2f4e8;color:#173f26;border-color:#366244;box-shadow:0 5px 0 #366244}.card.matched span:before{content:'✓ ';}#message{padding:12px 0;color:#40367c}#win{border:3px solid #366244}#win h2:before{content:'⭐ ';}
@media(max-width:500px){main{margin:10px}.controls{padding:12px}.stats{gap:8px}.stats>div{padding:10px}.card{font-size:36px}}

.card.open>div{font-size:clamp(64px,10vw,92px);line-height:1.1}
.card{min-height:170px}
@media(max-width:500px){.card{min-height:132px}.card.open>div{font-size:clamp(48px,13vw,66px)}}
</style><main><h1>MEMOTEST INCLUSIVO</h1><p>ENCONTRÁ LAS PAREJAS DE ÚTILES ESCOLARES.<br>TOCÁ DOS TARJETAS POR VEZ.</p><div class="controls"><label for="level">NIVEL</label><select id="level"><option value="4">1 · 4 PAREJAS</option><option value="6" selected>2 · 6 PAREJAS</option><option value="8">3 · 8 PAREJAS</option></select><button class="primary" id="start">JUGAR</button><button id="sound" aria-pressed="false">VOZ: DESACTIVADA</button></div><div class="stats"><div id="moves">INTENTOS: 0</div><div id="pairs">PAREJAS: 0 / 6</div></div><div id="message" role="status" aria-live="polite">PRESIONÁ JUGAR PARA EMPEZAR.</div><div id="board" aria-label="TARJETAS DEL MEMOTEST"></div><div id="win" hidden><h2>¡MUY BIEN! COMPLETASTE EL JUEGO.</h2><p id="result"></p><button id="again" class="primary">JUGAR DE NUEVO</button><button id="next">SIGUIENTE NIVEL</button></div><p style="font-size:16px">PODÉS JUGAR CON EL MOUSE, CON EL DEDO O CON TAB Y ENTER. LA VOZ DEPENDE DE LAS VOCES DISPONIBLES EN TU DISPOSITIVO.</p></main>
<script>
const items=[['📖','LIBRO'],['✏️','LÁPIZ'],['🎒','MOCHILA'],['📏','REGLA'],['✂️','TIJERA'],['🧮','CALCULADORA'],['🖊️','LAPICERA'],['📓','CUADERNO']];
const $=id=>document.getElementById(id);let deck=[],first=null,locked=false,attempts=0,found=0,voice=false,round=0,active=false;
function say(t){if(voice&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.85;speechSynthesis.speak(u)}}
function status(t){$('message').textContent=t;say(t)}
function stats(){$('moves').textContent='INTENTOS: '+attempts;$('pairs').textContent='PAREJAS: '+found+' / '+deck.length/2}
function reveal(b,i){b.classList.add('open');b.innerHTML='<div aria-hidden="true">'+deck[i][0]+'</div><span>'+deck[i][1]+'</span>';b.setAttribute('aria-label','TARJETA '+(i+1)+': '+deck[i][1]);b.setAttribute('aria-pressed','true')}
function hide(b,i){b.classList.remove('open');b.textContent='?';b.setAttribute('aria-label','TARJETA '+(i+1)+', OCULTA');b.setAttribute('aria-pressed','false')}
function flip(b,i){if(locked||b.disabled||b.classList.contains('open'))return;reveal(b,i);say(deck[i][1]);if(first===null){first=i;return}attempts++;stats();const a=first;first=null;const buttons=$('board').children;if(deck[a][1]===deck[i][1]){buttons[a].classList.add('matched');b.classList.add('matched');buttons[a].disabled=b.disabled=true;found++;stats();status('¡ENCONTRASTE UNA PAREJA!');if(found===deck.length/2){active=false;$('win').hidden=false;$('result').textContent='ENCONTRASTE '+found+' PAREJAS EN '+attempts+' INTENTOS.';$('next').hidden=$('level').value==='8';status('¡MUY BIEN! COMPLETASTE EL JUEGO.');$('again').focus()}}else{locked=true;status('PROBÁ OTRA VEZ.');const token=round;setTimeout(()=>{if(token!==round)return;hide(buttons[a],a);hide(b,i);locked=false;status('ELEGÍ DOS TARJETAS.')},1600)}}
function start(){round++;active=true;first=null;locked=false;attempts=found=0;$('win').hidden=true;let n=Number($('level').value);deck=items.slice(0,n).flatMap(x=>[x,x]);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}$('board').replaceChildren();deck.forEach((x,i)=>{let b=document.createElement('button');b.className='card';hide(b,i);b.onclick=()=>flip(b,i);$('board').append(b)});stats();$('start').textContent='REINICIAR';status('ELEGÍ DOS TARJETAS.');$('board').firstChild.focus()}
$('start').onclick=start;$('again').onclick=start;$('next').onclick=()=>{$('level').value=Number($('level').value)===4?'6':'8';start()};$('level').onchange=()=>{if(active||deck.length)start();else $('pairs').textContent='PAREJAS: 0 / '+$('level').value};$('sound').onclick=()=>{voice=!voice;$('sound').textContent='VOZ: '+(voice?'ACTIVADA':'DESACTIVADA');$('sound').setAttribute('aria-pressed',String(voice));if(voice)say('Voz activada. Encontrá las parejas.');else if('speechSynthesis'in window)speechSynthesis.cancel()};
</script></html>
