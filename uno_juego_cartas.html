<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UNO - Solo y Multijugador</title>
<style>
:root{--bg:#0b1020;--panel:#171d2a;--text:#f8fafc;--muted:#cbd5e1;--line:#475569;--shadow:0 16px 40px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#1f2937 0,#0b1020 55%,#060910 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{padding:16px}
button{font:inherit}
#app{width:min(100%,880px);margin:0 auto}
.screen{display:none}.screen.active{display:block}
.logo{width:118px;height:118px;border-radius:50%;margin:8px auto 18px;background:conic-gradient(#d62436 0 25%,#e3b400 25% 50%,#15803d 50% 75%,#1769aa 75%);border:6px solid white;display:flex;align-items:center;justify-content:center;transform:rotate(-9deg);box-shadow:var(--shadow)}
.logo span{font-size:45px;font-weight:1000;letter-spacing:-3px;text-shadow:0 3px 3px rgba(0,0,0,.45);transform:rotate(9deg)}
h1{text-align:center;font-size:clamp(30px,8vw,52px);margin:0 0 6px}
.subtitle{text-align:center;color:var(--muted);font-size:18px;font-weight:750;margin:0 0 24px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mode{display:flex;flex-direction:column;gap:8px;min-height:220px;color:inherit;background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.mode:focus-visible,.back:focus-visible{outline:5px solid white;outline-offset:4px}
.mode:hover{border-color:#fff}
.icon{font-size:48px;line-height:1}
.mode h2{font-size:25px;margin:4px 0 0}
.mode p{margin:0;color:var(--muted);line-height:1.45;font-weight:650}
.badge{margin-top:auto;align-self:flex-start;background:#f8fafc;color:#111827;padding:9px 13px;border-radius:999px;font-weight:950}
.gamebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 auto 10px}
.back{border:2px solid #64748b;background:#111827;color:white;border-radius:14px;min-height:46px;padding:10px 14px;font-weight:900;cursor:pointer}
.mode-title{font-weight:950;color:#e2e8f0}
.frame-wrap{background:#0b1020;border-radius:20px;overflow:hidden;border:2px solid #334155}
iframe{display:block;width:100%;border:0;background:#0b1020;min-height:900px}
.note{text-align:center;color:#94a3b8;margin:18px 0 0;font-size:14px}
@media(max-width:560px){body{padding:8px}.options{grid-template-columns:1fr}.mode{min-height:175px}.logo{width:96px;height:96px}.logo span{font-size:37px}.gamebar{padding:0 2px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app">
<section id="menu" class="screen active" aria-label="Elegir modo de juego">
  <div class="logo" aria-hidden="true"><span>UNO</span></div>
  <h1>¿CÓMO QUERÉS JUGAR?</h1>
  <p class="subtitle">LOS DOS MODOS ESTÁN DENTRO DE ESTE MISMO JUEGO</p>
  <div class="options">
    <button id="multiBtn" class="mode" type="button">
      <div class="icon" aria-hidden="true">👥</div>
      <h2>MULTIJUGADOR</h2>
      <p>JUGÁ CON OTRAS PERSONAS. CADA JUGADOR ENTRA DESDE SU PROPIO CELULAR CON UN CÓDIGO DE SALA.</p>
      <span class="badge">JUGAR MULTIJUGADOR</span>
    </button>
    <button id="soloBtn" class="mode" type="button">
      <div class="icon" aria-hidden="true">👤</div>
      <h2>JUGAR SOLO</h2>
      <p>JUGÁ CONTRA LA COMPUTADORA DESDE UN SOLO CELULAR O COMPUTADORA.</p>
      <span class="badge">JUGAR SOLO</span>
    </button>
  </div>
  <p class="note">NO NECESITÁS ABRIR OTRO ARCHIVO.</p>
</section>

<section id="game" class="screen" aria-label="Juego UNO">
  <div class="gamebar">
    <button id="backBtn" class="back" type="button">← VOLVER A ELEGIR MODO</button>
    <div id="modeTitle" class="mode-title"></div>
  </div>
  <div class="frame-wrap">
    <iframe id="gameFrame" title="Juego UNO seleccionado" allow="autoplay"></iframe>
  </div>
</section>
</main>

<script>
const MULTI_SOURCE="<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\" />\n<title>UNO Multijugador</title>\n<script src=\"https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js\"><\/script>\n<style>\n:root{--bg:#0d1117;--panel:#171d26;--panel2:#202938;--text:#f8fafc;--muted:#cbd5e1;--line:#475569;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--shadow:0 10px 28px rgba(0,0,0,.32)}\n*{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(180deg,#111827,#070b12);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}\nbutton,input{font:inherit} button{touch-action:manipulation}.app{width:min(100%,820px);margin:0 auto;padding:14px 12px 30px}h1{text-align:center;font-size:clamp(30px,8vw,50px);margin:4px 0 8px;letter-spacing:1px}.subtitle{text-align:center;color:var(--muted);font-weight:750;margin:0 0 14px}.panel{background:var(--panel);border:2px solid #334155;border-radius:22px;padding:16px;box-shadow:var(--shadow)}.hidden{display:none!important}.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.setup-card{background:var(--panel2);border:2px solid #475569;border-radius:18px;padding:14px}.setup-card h2{margin:0 0 10px;font-size:20px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-weight:850}.field input{width:100%;min-height:48px;border:2px solid #64748b;border-radius:12px;background:#0f172a;color:white;padding:10px 12px;font-size:17px;text-transform:uppercase}.btn{border:0;border-radius:14px;min-height:50px;padding:12px 14px;font-weight:950;cursor:pointer}.btn-main{background:#f8fafc;color:#111827}.btn-alt{background:#334155;color:#fff}.btn-uno{background:#f59e0b;color:#111827}.btn-danger{background:#991b1b;color:#fff}.btn:disabled{opacity:.48;cursor:not-allowed}.status{margin-top:12px;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:14px;background:#0f172a;border:2px solid #334155;padding:10px;font-weight:800}.room-head{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.room-code{background:#020617;border:2px dashed #94a3b8;border-radius:14px;padding:10px 14px;font-size:24px;font-weight:1000;letter-spacing:3px}.players{display:grid;gap:8px;margin:14px 0}.player-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0f172a;border:2px solid #334155;border-radius:14px;padding:10px 12px}.player-row.current{outline:4px solid white}.player-row.me{border-color:#e2e8f0}.tag{font-size:12px;font-weight:950;padding:4px 8px;border-radius:999px;background:#334155}.lobby-actions{display:flex;gap:10px;flex-wrap:wrap}.game-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{background:var(--panel);border:2px solid #334155;border-radius:14px;text-align:center;padding:9px;font-weight:900;min-width:0}.stat small{display:block;color:var(--muted);font-size:11px}.message{min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;background:#0f172a;border:2px solid #334155;border-radius:16px;padding:10px 14px;margin:10px 0;font-weight:850}.table{background:radial-gradient(circle at center,#21432d,#10231a 70%);border:3px solid #43596a;border-radius:28px;padding:16px 10px;box-shadow:var(--shadow)}.opponents{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}.opp{min-width:128px;background:rgba(2,6,23,.72);border:2px solid #64748b;border-radius:14px;padding:8px;text-align:center}.opp.current{outline:4px solid white}.opp-name{font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.opp-count{font-size:28px;font-weight:1000}.color-pill{width:max-content;max-width:100%;margin:6px auto 10px;background:#0f172a;border:2px solid #64748b;border-radius:999px;padding:8px 14px;font-weight:950}.center{display:grid;grid-template-columns:1fr 1fr;gap:14px;justify-items:center;align-items:center;margin:10px 0 16px}.pile-wrap{text-align:center}.pile-label{font-size:13px;font-weight:900;margin-top:6px}.draw{width:110px;height:154px;border:4px solid white;border-radius:18px;background:linear-gradient(145deg,#090909 0 28%,#ef123f 28% 72%,#090909 72%);color:white;font-size:22px;font-weight:1000;box-shadow:var(--shadow);cursor:pointer}.card{width:110px;height:154px;border-radius:18px;border:4px solid white;position:relative;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:40px;color:white;text-shadow:0 2px 2px rgba(0,0,0,.4);box-shadow:var(--shadow);flex:0 0 auto;user-select:none}.card::before{content:\"\";position:absolute;inset:24px 13px;border-radius:50%;border:3px solid rgba(255,255,255,.88);transform:rotate(-24deg)}.card .main{z-index:2}.card .corner{position:absolute;z-index:3;top:6px;left:8px;font-size:21px}.red{background:#c81e32}.yellow{background:#e0ad00;color:#111;text-shadow:none}.green{background:#16783b}.blue{background:#1764a6}.wild{background:conic-gradient(#c81e32 0 25%,#e0ad00 25% 50%,#16783b 50% 75%,#1764a6 75% 100%)}.hand-title{font-weight:950;font-size:19px;margin:6px 2px}.hand{display:flex;gap:8px;overflow-x:auto;padding:9px 4px 14px;scroll-snap-type:x proximity}.hand .card{width:88px;height:128px;font-size:33px;cursor:pointer;scroll-snap-align:start;transition:transform .12s ease,outline .12s ease}.hand .card .corner{font-size:17px}.hand .card.playable{outline:4px solid white;transform:translateY(-5px)}.hand .card:disabled{opacity:.58;cursor:not-allowed}.game-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.note{margin-top:12px;background:#111827;border:2px solid #334155;border-radius:16px;padding:12px;line-height:1.45;color:#e2e8f0}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.76);z-index:30;padding:20px}.modal.show{display:flex}.modal-box{width:min(100%,430px);background:#111827;border:3px solid white;border-radius:22px;padding:20px;text-align:center}.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}.color-btn{min-height:70px;border:4px solid white;border-radius:15px;font-weight:1000;font-size:17px;cursor:pointer}.winner{font-size:34px;margin:0 0 6px}.confetti{font-size:44px;line-height:1.1}.connection-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ef4444;margin-right:6px}.connection-dot.on{background:#22c55e}@media(max-width:560px){.setup-grid{grid-template-columns:1fr}.game-top{grid-template-columns:1fr 1fr}.game-top .stat:last-child{grid-column:1/-1}.app{padding-left:8px;padding-right:8px}.table{padding-left:7px;padding-right:7px}.draw,.card{width:94px;height:138px}.hand .card{width:80px;height:118px}.center{gap:8px}.room-code{font-size:21px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}\n</style>\n</head>\n<body>\n<main class=\"app\">\n<h1>UNO MULTIJUGADOR</h1>\n<p class=\"subtitle\">CADA JUGADOR JUEGA DESDE SU PROPIO CELULAR</p>\n<section id=\"setup\" class=\"panel\">\n  <div class=\"setup-grid\">\n    <div class=\"setup-card\">\n      <h2>CREAR SALA</h2>\n      <div class=\"field\"><label for=\"hostName\">TU NOMBRE</label><input id=\"hostName\" maxlength=\"16\" placeholder=\"EJ.: KAREN\" autocomplete=\"off\"></div>\n      <button id=\"createRoom\" class=\"btn btn-main\" type=\"button\">CREAR SALA</button>\n    </div>\n    <div class=\"setup-card\">\n      <h2>ENTRAR A UNA SALA</h2>\n      <div class=\"field\"><label for=\"joinName\">TU NOMBRE</label><input id=\"joinName\" maxlength=\"16\" placeholder=\"EJ.: ANA\" autocomplete=\"off\"></div>\n      <div class=\"field\"><label for=\"roomInput\">CÓDIGO DE SALA</label><input id=\"roomInput\" maxlength=\"6\" placeholder=\"ABC123\" autocomplete=\"off\"></div>\n      <button id=\"joinRoom\" class=\"btn btn-main\" type=\"button\">ENTRAR</button>\n    </div>\n  </div>\n  <div id=\"setupStatus\" class=\"status\" role=\"status\" aria-live=\"polite\"><span><span id=\"netDot\" class=\"connection-dot\"></span>CREÁ UNA SALA O INGRESÁ CON UN CÓDIGO.</span></div>\n</section>\n\n<section id=\"lobby\" class=\"panel hidden\" aria-label=\"Sala de espera\">\n  <div class=\"room-head\"><div><strong>SALA DE ESPERA</strong><div style=\"color:#cbd5e1;font-size:14px\">COMPARTÍ ESTE CÓDIGO</div></div><div id=\"roomCode\" class=\"room-code\">------</div></div>\n  <div id=\"lobbyPlayers\" class=\"players\"></div>\n  <div id=\"lobbyMessage\" class=\"status\" role=\"status\" aria-live=\"polite\">ESPERANDO JUGADORES…</div>\n  <div class=\"lobby-actions\"><button id=\"startGame\" class=\"btn btn-main\" type=\"button\">INICIAR PARTIDA</button><button id=\"leaveLobby\" class=\"btn btn-danger\" type=\"button\">SALIR</button></div>\n  <div class=\"note\">SE NECESITAN <strong>2 A 6 JUGADORES</strong>. EL CREADOR DE LA SALA INICIA LA PARTIDA.</div>\n</section>\n\n<section id=\"game\" class=\"hidden\">\n  <div class=\"game-top\"><div class=\"stat\"><small>SALA</small><span id=\"gameRoom\">—</span></div><div class=\"stat\"><small>TURNO</small><span id=\"turnName\">—</span></div><div class=\"stat\"><small>TUS CARTAS</small><span id=\"myCount\">0</span></div></div>\n  <div id=\"gameMessage\" class=\"message\" role=\"status\" aria-live=\"polite\">PREPARANDO PARTIDA…</div>\n  <section class=\"table\" aria-label=\"Mesa de UNO\">\n    <div id=\"opponents\" class=\"opponents\"></div>\n    <div id=\"currentColor\" class=\"color-pill\">COLOR ACTUAL: —</div>\n    <div class=\"center\">\n      <div class=\"pile-wrap\"><button id=\"drawPile\" class=\"draw\" type=\"button\" disabled>ROBAR</button><div class=\"pile-label\">MAZO</div></div>\n      <div class=\"pile-wrap\"><div id=\"discard\"></div><div class=\"pile-label\">CARTA EN JUEGO</div></div>\n    </div>\n    <div class=\"hand-title\">TUS CARTAS</div>\n    <div id=\"myHand\" class=\"hand\" aria-label=\"Tus cartas\"></div>\n  </section>\n  <div class=\"game-controls\"><button id=\"passTurn\" class=\"btn btn-alt\" type=\"button\" disabled>PASAR</button><button id=\"unoButton\" class=\"btn btn-uno\" type=\"button\" disabled>¡UNO!</button></div>\n  <div class=\"note\"><strong>CÓMO JUGAR:</strong> TOCÁ UNA CARTA DEL MISMO <strong>COLOR, NÚMERO O SÍMBOLO</strong>. SI NO TENÉS UNA CARTA VÁLIDA, TOCÁ <strong>ROBAR</strong>. LAS CARTAS <strong>+2, SALTA, CAMBIO DE SENTIDO, COMODÍN Y +4</strong> TIENEN EFECTOS ESPECIALES.</div>\n</section>\n</main>\n\n<div id=\"colorModal\" class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"colorTitle\"><div class=\"modal-box\"><h2 id=\"colorTitle\">ELEGÍ UN COLOR</h2><div class=\"colors\"><button class=\"color-btn red\" data-color=\"red\" type=\"button\">ROJO</button><button class=\"color-btn yellow\" data-color=\"yellow\" type=\"button\">AMARILLO</button><button class=\"color-btn green\" data-color=\"green\" type=\"button\">VERDE</button><button class=\"color-btn blue\" data-color=\"blue\" type=\"button\">AZUL</button></div></div></div>\n<div id=\"endModal\" class=\"modal\" role=\"dialog\" aria-modal=\"true\"><div class=\"modal-box\"><div class=\"confetti\">🎉🏆🎉</div><h2 id=\"endTitle\" class=\"winner\">FIN DE LA PARTIDA</h2><p id=\"endText\"></p><button id=\"backLobby\" class=\"btn btn-main\" style=\"width:100%\" type=\"button\">VOLVER A LA SALA</button></div></div>\n\n<script>\n(() => {\n'use strict';\nconst COLORS=['red','yellow','green','blue'];\nconst COLOR_NAMES={red:'ROJO',yellow:'AMARILLO',green:'VERDE',blue:'AZUL'};\nconst SYMBOLS={skip:'⛔',reverse:'↔',draw2:'+2',wild:'★',wild4:'+4'};\nconst MAX_PLAYERS=6;\nlet peer=null,hostConn=null,isHost=false,myId=null,roomCode='',pendingWildCardId=null;\nlet conns=new Map();\nlet hostState=null;\nlet view={started:false,players:[],hand:[],top:null,currentColor:null,currentId:null,message:'',winner:null,canDraw:false,canPass:false,unoCalled:false,roomCode:''};\nconst el=id=>document.getElementById(id);\nconst cleanName=v=>(v||'').trim().replace(/\\s+/g,' ').slice(0,16).toUpperCase();\nconst cleanCode=v=>(v||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);\nconst randCode=()=>{const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s};\nconst safeSend=(conn,data)=>{try{if(conn&&conn.open)conn.send(data)}catch(e){console.warn(e)}};\nfunction setScreen(name){el('setup').classList.toggle('hidden',name!=='setup');el('lobby').classList.toggle('hidden',name!=='lobby');el('game').classList.toggle('hidden',name!=='game')}\nfunction setSetupStatus(text,ok=false){el('setupStatus').innerHTML='<span><span class=\"connection-dot '+(ok?'on':'')+'\"></span>'+escapeHtml(text)+'</span>'}\nfunction escapeHtml(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}\nfunction destroyPeer(){try{if(hostConn)hostConn.close()}catch{};hostConn=null;for(const c of conns.values()){try{c.close()}catch{}}conns.clear();try{if(peer)peer.destroy()}catch{}peer=null;isHost=false;myId=null;roomCode='';hostState=null;view={started:false,players:[],hand:[],top:null,currentColor:null,currentId:null,message:'',winner:null,canDraw:false,canPass:false,unoCalled:false,roomCode:''}}\nfunction makeDeck(){let uid=0,d=[];for(const color of COLORS){d.push({id:'c'+(++uid),color,value:'0'});for(let n=1;n<=9;n++){d.push({id:'c'+(++uid),color,value:String(n)});d.push({id:'c'+(++uid),color,value:String(n)})}for(const value of ['skip','reverse','draw2']){d.push({id:'c'+(++uid),color,value});d.push({id:'c'+(++uid),color,value})}}for(let i=0;i<4;i++){d.push({id:'c'+(++uid),color:'wild',value:'wild'});d.push({id:'c'+(++uid),color:'wild',value:'wild4'})}return shuffle(d)}\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction topCard(){return hostState?.discard?.[hostState.discard.length-1]||null}\nfunction replenish(){if(hostState.deck.length===0&&hostState.discard.length>1){const top=hostState.discard.pop();hostState.deck=shuffle(hostState.discard.splice(0));hostState.discard=[top]}}\nfunction drawTo(playerId,n=1){const h=hostState.hands[playerId];if(!h)return;for(let i=0;i<n;i++){replenish();if(hostState.deck.length)h.push(hostState.deck.pop())}}\nfunction canPlay(card){const top=topCard();if(!card||!top)return false;if(card.color==='wild')return true;return card.color===hostState.currentColor||card.value===top.value}\nfunction activePlayer(){return hostState.players[hostState.currentIndex]||null}\nfunction stepIndex(from,steps=1){const n=hostState.players.length;if(!n)return 0;let x=from;for(let i=0;i<steps;i++)x=(x+hostState.direction+n)%n;return x}\nfunction advance(steps=1){hostState.currentIndex=stepIndex(hostState.currentIndex,steps);hostState.drawnCardId=null;hostState.canPass=false;hostState.unoCalled=false}\nfunction startHostGame(){if(!isHost||!hostState)return;if(hostState.players.length<2){hostState.message='SE NECESITAN AL MENOS 2 JUGADORES.';broadcastViews();return}if(hostState.players.length>MAX_PLAYERS)return;hostState.started=true;hostState.winner=null;hostState.deck=makeDeck();hostState.discard=[];hostState.hands={};hostState.direction=1;hostState.currentIndex=0;hostState.currentColor=null;hostState.drawnCardId=null;hostState.canPass=false;hostState.unoCalled=false;for(const p of hostState.players)hostState.hands[p.id]=[];for(let i=0;i<7;i++)for(const p of hostState.players)drawTo(p.id,1);let first=null;while(hostState.deck.length){const c=hostState.deck.pop();if(c.color!=='wild'){first=c;break}hostState.deck.unshift(c)}if(!first)first=hostState.deck.pop();hostState.discard.push(first);hostState.currentColor=first.color==='wild'?COLORS[Math.floor(Math.random()*4)]:first.color;hostState.message='COMIENZA LA PARTIDA. TURNO DE '+activePlayer().name+'.';broadcastViews()}\nfunction processAction(playerId,action){if(!isHost||!hostState?.started||hostState.winner)return;const cur const SOLO_SOURCE="<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\" />\n<title>UNO - Juego de Cartas</title>\n<style>\n  :root{--bg:#10151f;--panel:#1a2230;--text:#f7f7f7;--muted:#c4c9d1;--accent:#ffffff;--shadow:0 10px 25px rgba(0,0,0,.28)}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#111827,#0b1020);color:var(--text);display:flex;justify-content:center}\n  button{font:inherit}\n  .app{width:min(100%,760px);min-height:100vh;padding:14px 12px 24px}\n  h1{margin:4px 0 12px;text-align:center;font-size:clamp(28px,8vw,48px);letter-spacing:1px}\n  .topbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}\n  .stat{background:var(--panel);border:2px solid #334155;border-radius:16px;padding:10px 12px;text-align:center;font-weight:800}\n  .message{min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;background:#0f172a;border:2px solid #334155;border-radius:16px;padding:10px 14px;margin-bottom:12px;font-weight:750}\n  .table{background:radial-gradient(circle at center,#23412e,#10251a 68%);border:3px solid #43596a;border-radius:28px;padding:18px 12px;box-shadow:var(--shadow)}\n  .computer{text-align:center;margin-bottom:12px}\n  .computer-hand{display:flex;justify-content:center;gap:4px;min-height:78px;overflow:hidden;padding:5px}\n  .card-back{width:48px;height:72px;border-radius:10px;background:linear-gradient(135deg,#111 0 35%,#e11d48 35% 65%,#111 65%);border:3px solid #fff;box-shadow:0 4px 8px rgba(0,0,0,.3)}\n  .center{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;justify-items:center;margin:12px 0 18px}\n  .pile-wrap{text-align:center}.pile-label{font-size:14px;font-weight:800;margin-top:6px;color:#e5e7eb}\n  .draw{width:112px;height:158px;border:4px solid #fff;border-radius:18px;background:linear-gradient(145deg,#0b0b0b 0 28%,#ef123f 28% 72%,#0b0b0b 72%);color:#fff;font-size:24px;font-weight:1000;cursor:pointer;box-shadow:var(--shadow)}\n  .draw:disabled{opacity:.5;cursor:not-allowed}\n  .card{width:112px;height:158px;border-radius:18px;border:4px solid #fff;position:relative;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:42px;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.35);box-shadow:var(--shadow);flex:0 0 auto;user-select:none}\n  .card::before{content:\"\";position:absolute;inset:25px 14px;border-radius:50%;border:3px solid rgba(255,255,255,.85);transform:rotate(-24deg)}\n  .card .main{z-index:2}.card .corner{position:absolute;z-index:3;top:6px;left:8px;font-size:22px;text-shadow:0 1px 2px rgba(0,0,0,.45)}\n  .red{background:#d62436}.yellow{background:#e3b400;color:#111;text-shadow:none}.green{background:#15803d}.blue{background:#1769aa}\n  .wild{background:conic-gradient(#d62436 0 25%,#e3b400 25% 50%,#15803d 50% 75%,#1769aa 75% 100%)}\n  .current-color{margin:0 auto 14px;width:max-content;max-width:100%;border-radius:999px;padding:8px 14px;background:#0f172a;border:2px solid #475569;font-weight:900}\n  .player-title{font-size:19px;font-weight:900;margin:6px 0 8px}\n  .hand{display:flex;gap:8px;overflow-x:auto;padding:8px 4px 14px;scroll-snap-type:x proximity}\n  .hand .card{width:92px;height:132px;font-size:34px;cursor:pointer;scroll-snap-align:start;transition:transform .12s ease,outline .12s ease}\n  .hand .card .corner{font-size:18px}.hand .card.playable{outline:4px solid #fff;transform:translateY(-5px)}.hand .card:not(.playable){opacity:.72}\n  .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}\n  .btn{border:none;border-radius:16px;padding:14px 12px;font-weight:950;font-size:17px;cursor:pointer;min-height:52px}\n  .btn-primary{background:#f8fafc;color:#111827}.btn-uno{background:#f59e0b;color:#111827}.btn:disabled{opacity:.45;cursor:not-allowed}\n  .legend{margin-top:14px;background:var(--panel);border-radius:18px;padding:12px 14px;color:#e5e7eb;line-height:1.4}.legend strong{color:#fff}\n  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:20;padding:20px}.modal.show{display:flex}\n  .modal-box{width:min(100%,430px);background:#111827;border:3px solid #fff;border-radius:24px;padding:22px;text-align:center;box-shadow:var(--shadow)}\n  .colors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}\n  .color-btn{min-height:72px;border:4px solid #fff;border-radius:16px;font-weight:950;font-size:18px;cursor:pointer}.win-title{font-size:34px;margin:0 0 8px}\n  @media (max-width:430px){.app{padding-left:8px;padding-right:8px}.table{padding-left:8px;padding-right:8px}.draw,.card{width:94px;height:138px}.hand .card{width:82px;height:120px}.center{gap:10px}}\n  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}\n</style>\n</head>\n<body>\n<main class=\"app\">\n  <h1>UNO</h1>\n  <div class=\"topbar\" aria-label=\"Marcador\"><div class=\"stat\">TUS CARTAS: <span id=\"playerCount\">0</span></div><div class=\"stat\">RIVAL: <span id=\"cpuCount\">0</span></div></div>\n  <div id=\"message\" class=\"message\" role=\"status\" aria-live=\"polite\">PRESIONÁ “NUEVA PARTIDA”.</div>\n  <section class=\"table\" aria-label=\"Mesa de juego\">\n    <div class=\"computer\"><div><strong>COMPUTADORA</strong></div><div id=\"cpuHand\" class=\"computer-hand\" aria-label=\"Cartas de la computadora\"></div></div>\n    <div id=\"currentColor\" class=\"current-color\">COLOR ACTUAL: —</div>\n    <div class=\"center\">\n      <div class=\"pile-wrap\"><button id=\"drawPile\" class=\"draw\" aria-label=\"Robar una carta\" disabled>ROBAR</button><div class=\"pile-label\">MAZO</div></div>\n      <div class=\"pile-wrap\"><div id=\"discard\" aria-label=\"Carta en juego\"></div><div class=\"pile-label\">CARTA EN JUEGO</div></div>\n    </div>\n    <div class=\"player-title\">TUS CARTAS</div>\n    <div id=\"playerHand\" class=\"hand\" aria-label=\"Tu mano de cartas\"></div>\n  </section>\n  <div class=\"controls\"><button id=\"newGame\" class=\"btn btn-primary\">NUEVA PARTIDA</button><button id=\"unoButton\" class=\"btn btn-uno\" disabled>¡UNO!</button></div>\n  <div class=\"legend\"><strong>CÓMO JUGAR:</strong> TOCÁ UNA CARTA QUE COINCIDA EN <strong>COLOR, NÚMERO O SÍMBOLO</strong>. SI NO PODÉS JUGAR, TOCÁ <strong>ROBAR</strong>. LAS CARTAS <strong>+2, SALTA, CAMBIO DE SENTIDO, COMODÍN Y +4</strong> TIENEN EFECTOS ESPECIALES. CUANDO TE QUEDE UNA SOLA CARTA, PRESIONÁ <strong>¡UNO!</strong>.</div>\n</main>\n<div id=\"colorModal\" class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"colorTitle\"><div class=\"modal-box\"><h2 id=\"colorTitle\">ELEGÍ UN COLOR</h2><div class=\"colors\"><button class=\"color-btn red\" data-color=\"red\">ROJO</button><button class=\"color-btn yellow\" data-color=\"yellow\">AMARILLO</button><button class=\"color-btn green\" data-color=\"green\">VERDE</button><button class=\"color-btn blue\" data-color=\"blue\">AZUL</button></div></div></div>\n<div id=\"endModal\" class=\"modal\" role=\"dialog\" aria-modal=\"true\"><div class=\"modal-box\"><h2 id=\"endTitle\" class=\"win-title\">¡GANASTE!</h2><p id=\"endText\"></p><button id=\"playAgain\" class=\"btn btn-primary\" style=\"width:100%\">JUGAR OTRA VEZ</button></div></div>\n<script>\n(() => {\n  const COLORS=[\"red\",\"yellow\",\"green\",\"blue\"];\n  const COLOR_NAMES={red:\"ROJO\",yellow:\"AMARILLO\",green:\"VERDE\",blue:\"AZUL\"};\n  const SYMBOLS={skip:\"⛔\",reverse:\"↔\",draw2:\"+2\",wild:\"★\",wild4:\"+4\"};\n  let deck=[],discardPile=[],player=[],cpu=[],currentColor=null,playerTurn=true,gameOver=true,unoCalled=false,pendingWild=null,playerDrewThisTurn=false;\n  const el=id=>document.getElementById(id),msg=t=>el(\"message\").textContent=t;\n  function makeDeck(){const d=[];for(const color of COLORS){d.push({color,value:\"0\"});for(let n=1;n<=9;n++){d.push({color,value:String(n)});d.push({color,value:String(n)})}for(const action of [\"skip\",\"reverse\",\"draw2\"]){d.push({color,value:action});d.push({color,value:action})}}for(let i=0;i<4;i++){d.push({color:\"wild\",value:\"wild\"});d.push({color:\"wild\",value:\"wild4\"})}return shuffle(d)}\n  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\n  function replenishDeck(){if(deck.length===0&&discardPile.length>1){const top=discardPile.pop();deck=shuffle(discardPile.splice(0));discardPile=[top]}}\n  function drawCard(hand,amount=1){for(let i=0;i<amount;i++){replenishDeck();if(deck.length)hand.push(deck.pop())}}\n  function topCard(){return discardPile[discardPile.length-1]}\n  function label(card){if(card.value.match(/^\\d$/))return card.value;return SYMBOLS[card.value]||card.value}\n  function cardAria(card){const color=card.color===\"wild\"?\"COMODÍN\":COLOR_NAMES[card.color];const value={skip:\"SALTA TURNO\",reverse:\"CAMBIO DE SENTIDO\",draw2:\"ROBA DOS\",wild:\"COMODÍN\",wild4:\"COMODÍN ROBA CUATRO\"}[card.value]||card.value;return color+\" \"+value}\n  function canPlay(card){const top=topCard();if(!top)return false;if(card.color===\"wild\")return true;return card.color===currentColor||card.value===top.value}\n  function createCard(card,idx=null,interactive=false){const div=document.createElement(interactive?\"button\":\"div\");div.className=\"card \"+card.color;div.setAttribute(\"aria-label\",cardAria(card));if(interactive){div.type=\"button\";div.dataset.index=idx;if(canPlay(card)&&playerTurn&&!gameOver){div.classList.add(\"playable\");div.addEventListener(\"click\",()=>playPlayerCard(Number(div.dataset.index)))}else div.disabled=true}const corner=document.createElement(\"div\");corner.className=\"corner\";corner.textContent=label(card);const main=document.createElement(\"div\");main.className=\"main\";main.textContent=label(card);div.append(corner,main);return div}\n  function render(){el(\"playerCount\").textContent=player.length;el(\"cpuCount\").textContent=cpu.length;const ch=el(\"cpuHand\");ch.innerHTML=\"\";cpu.forEach(()=>{const b=document.createElement(\"div\");b.className=\"card-back\";ch.appendChild(b)});const ph=el(\"playerHand\");ph.innerHTML=\"\";player.forEach((c,i)=>ph.appendChild(createCard(c,i,true)));const dis=el(\"discard\");dis.innerHTML=\"\";if(topCard())dis.appendChild(createCard(topCard()));el(\"currentColor\").textContent=\"COLOR ACTUAL: \"+(currentColor?COLOR_NAMES[currentColor]:\"—\");el(\"drawPile\").disabled=gameOver||!playerTurn||playerDrewThisTurn;el(\"unoButton\").disabled=gameOver||player.length!==1||unoCalled}\n  function startGame(){deck=makeDeck();discardPile=[];player=[];cpu=[];playerTurn=true;gameOver=false;unoCalled=false;playerDrewThisTurn=false;el(\"drawPile\").textContent=\"ROBAR\";for(let i=0;i<7;i++){drawCard(player);drawCard(cpu)}let first;do{first=deck.pop();if(first.color===\"wild\")deck.unshift(first)}while(first.color===\"wild\");discardPile.push(first);currentColor=first.color;msg(\"TU TURNO. JUGÁ UNA CARTA DEL MISMO COLOR, NÚMERO O SÍMBOLO.\");render();if(first.value===\"draw2\"){drawCard(player,2);playerTurn=false;msg(\"LA PARTIDA EMPEZÓ CON +2. ROBÁS 2 CARTAS Y PIERDES EL TURNO.\");render();setTimeout(cpuTurn,700)}else if(first.value===\"skip\"||first.value===\"reverse\"){msg(\"LA PRIMERA CARTA TE HACE PERDER EL TURNO.\");playerTurn=false;render();setTimeout(cpuTurn,700)}}\n  function playPlayerCard(index){if(!playerTurn||gameOver)return;const card=player[index];if(!canPlay(card))return;player.splice(index,1);discardPile.push(card);playerDrewThisTurn=false;el(\"drawPile\").textContent=\"ROBAR\";if(card.color===\"wild\"){pendingWild={source:\"player\",card};el(\"colorModal\").classList.add(\"show\");render();return}currentColor=card.color;afterCardPlayed(\"player\",card)}\n  function afterCardPlayed(source,card){render();if(checkWin(source))return;const otherHand=source===\"player\"?cpu:player;if(card.value===\"draw2\"){drawCard(otherHand,2);msg(source===\"player\"?\"¡+2! LA COMPUTADORA ROBA 2. VOLVÉS A JUGAR.\":\"LA COMPUTADORA JUGÓ +2. ROBÁS 2. SU TURNO CONTINÚA.\");render();if(source===\"player\")playerTurn=true;else{playerTurn=false;setTimeout(cpuTurn,900)}return}if(card.value===\"skip\"||card.value===\"reverse\"){msg(source===\"player\"?\"¡SALTA! LA COMPUTADORA PIERDE EL TURNO. VOLVÉS A JUGAR.\":\"LA COMPUTADORA TE HACE PERDER EL TURNO.\");if(source===\"player\"){playerTurn=true;render()}else{playerTurn=false;render();setTimeout(cpuTurn,900)}return}if(source===\"player\"){playerTurn=false;unoCalled=false;msg(\"TURNO DE LA COMPUTADORA…\");render();setTimeout(cpuTurn,700)}else{playerTurn=true;unoCalled=false;playerDrewThisTurn=false;msg(\"TU TURNO.\");render()}}\n  function chooseCpuColor(){const counts={red:0,yellow:0,green:0,blue:0};cpu.forEach(c=>{if(counts[c.color]!==undefined)counts[c.color]++});return COLORS.slice().sort((a,b)=>counts[b]-counts[a])[0]||COLORS[Math.floor(Math.random()*4)]}\n  function cpuTurn(){if(gameOver)return;playerTurn=false;render();const playable=cpu.map((c,i)=>({c,i})).filter(x=>canPlay(x.c));if(playable.length===0){drawCard(cpu,1);msg(\"LA COMPUTADORA ROBÓ UNA CARTA.\");render();const i=cpu.length-1;if(canPlay(cpu[i]))setTimeout(()=>cpuPlay(i),550);else setTimeout(()=>{playerTurn=true;playerDrewThisTurn=false;msg(\"TU TURNO.\");render()},550);return}playable.sort((a,b)=>{const s=v=>[\"wild4\",\"draw2\",\"skip\",\"reverse\",\"wild\"].includes(v)?1:0;return s(b.c.value)-s(a.c.value)});setTimeout(()=>cpuPlay(playable[0].i),550)}\n  function cpuPlay(index){if(gameOver)return;const card=cpu[index];cpu.splice(index,1);discardPile.push(card);if(card.color===\"wild\"){currentColor=chooseCpuColor();msg(\"LA COMPUTADORA CAMBIÓ EL COLOR A \"+COLOR_NAMES[currentColor]+\".\");render();if(checkWin(\"cpu\"))return;if(card.value===\"wild4\"){drawCard(player,4);msg(\"LA COMPUTADORA JUGÓ +4 Y ELIGIÓ \"+COLOR_NAMES[currentColor]+\". ROBÁS 4 CARTAS Y PIERDES EL TURNO.\");render();setTimeout(cpuTurn,950)}else{playerTurn=true;playerDrewThisTurn=false;setTimeout(()=>{msg(\"TU TURNO. COLOR: \"+COLOR_NAMES[currentColor]+\".\");render()},400)}return}currentColor=card.color;afterCardPlayed(\"cpu\",card)}\n  function checkWin(source){const hand=source===\"player\"?player:cpu;if(hand.length===0){gameOver=true;const won=source===\"player\";el(\"endTitle\").textContent=won?\"🏆 ¡GANASTE!\":\"FIN DE LA PARTIDA\";el(\"endText\").textContent=won?\"¡Muy bien! Te quedaste sin cartas.\":\"La computadora se quedó sin cartas primero.\";el(\"endModal\").classList.add(\"show\");msg(won?\"¡GANASTE LA PARTIDA!\":\"GANÓ LA COMPUTADORA.\");render();return true}return false}\n  el(\"drawPile\").addEventListener(\"click\",()=>{if(playerDrewThisTurn&&el(\"drawPile\").textContent===\"PASAR\"){playerTurn=false;playerDrewThisTurn=false;el(\"drawPile\").textContent=\"ROBAR\";msg(\"PASASTE. TURNO DE LA COMPUTADORA.\");render();setTimeout(cpuTurn,600);return}if(gameOver||!playerTurn||playerDrewThisTurn)return;drawCard(player,1);playerDrewThisTurn=true;const card=player[player.length-1];if(canPlay(card)){msg(\"ROBASTE UNA CARTA. PODÉS JUGARLA SI QUERÉS.\");render();setTimeout(()=>{if(playerTurn&&playerDrewThisTurn&&!gameOver){el(\"drawPile\").disabled=false;el(\"drawPile\").textContent=\"PASAR\"}},30)}else{msg(\"NO PODÉS JUGAR LA CARTA ROBADA. TURNO DE LA COMPUTADORA.\");render();setTimeout(()=>{playerTurn=false;playerDrewThisTurn=false;el(\"drawPile\").textContent=\"ROBAR\";cpuTurn()},700)}});\n  document.querySelectorAll(\".color-btn\").forEach(btn=>btn.addEventListener(\"click\",()=>{const chosen=btn.dataset.color;el(\"colorModal\").classList.remove(\"show\");currentColor=chosen;const p=pendingWild;pendingWild=null;if(!p)return;if(checkWin(\"player\"))return;if(p.card.value===\"wild4\"){drawCard(cpu,4);msg(\"ELEGISTE \"+COLOR_NAMES[chosen]+\". LA COMPUTADORA ROBA 4 Y PIERDE EL TURNO. VOLVÉS A JUGAR.\");playerTurn=true;render()}else{msg(\"ELEGISTE \"+COLOR_NAMES[chosen]+\". TURNO DE LA COMPUTADORA.\");playerTurn=false;render();setTimeout(cpuTurn,700)}}));\n  el(\"unoButton\").addEventListener(\"click\",()=>{if(player.length===1&&!gameOver){unoCalled=true;msg(\"¡UNO! TE QUEDA UNA SOLA CARTA.\");render()}});\n  el(\"newGame\").addEventListener(\"click\",startGame);\n  el(\"playAgain\").addEventListener(\"click\",()=>{el(\"endModal\").classList.remove(\"show\");startGame()});\n  render();\n})();\n<\/script>\n</body>\n</html>";
const menu=document.getElementById("menu");
const game=document.getElementById("game");
const frame=document.getElementById("gameFrame");
const modeTitle=document.getElementById("modeTitle");
let resizeObserver=null;

function resizeFrame(){
  try{
    const doc=frame.contentDocument;
    if(!doc) return;
    const h=Math.max(
      doc.documentElement ? doc.documentElement.scrollHeight : 0,
      doc.body ? doc.body.scrollHeight : 0,
      900
    );
    frame.style.height=Math.min(Math.max(h,900),2600)+"px";
  }catch(e){
    frame.style.height="1400px";
  }
}

function observeFrame(){
  try{
    if(resizeObserver) resizeObserver.disconnect();
    const doc=frame.contentDocument;
    if(!doc || !doc.body) return;
    resizeObserver=new ResizeObserver(resizeFrame);
    resizeObserver.observe(doc.body);
    resizeFrame();
  }catch(e){}
}

function openMode(mode){
  menu.classList.remove("active");
  game.classList.add("active");
  modeTitle.textContent=mode==="multi" ? "MODO: MULTIJUGADOR" : "MODO: JUGAR SOLO";
  frame.srcdoc=mode==="multi" ? MULTI_SOURCE : SOLO_SOURCE;
  frame.onload=()=>{
    observeFrame();
    window.scrollTo({top:0,behavior:"auto"});
  };
}

function backToMenu(){
  if(resizeObserver){resizeObserver.disconnect();resizeObserver=null;}
  frame.srcdoc="";
  game.classList.remove("active");
  menu.classList.add("active");
  modeTitle.textContent="";
  window.scrollTo({top:0,behavior:"auto"});
}

document.getElementById("multiBtn").addEventListener("click",()=>openMode("multi"));
document.getElementById("soloBtn").addEventListener("click",()=>openMode("solo"));
document.getElementById("backBtn").addEventListener("click",backToMenu);
</script>
